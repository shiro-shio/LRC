
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRC 動態字幕</title>
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Google Fonts：僅預連線；實際字體於使用者選取時才動態載入（見 app.js） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <h2>LRC 字幕設定</h2>
                <div class="section">
                    <div class="section-title" style="
                        display:flex;
                        align-items:center;
                        justify-content:space-between;
                    ">
                        <span>
                            搜尋歌曲
                        </span>
                        <div class="custom-lyrics">
                            <button id="customLrcButton" type="button">
                                上傳
                            </button>
                            <input id="customLrcInput" type="file" accept=".lrc,text/plain" hidden>
                        </div>
                    </div>
                    <div class="search">
                        <input id="songInput" type="text" placeholder="輸入歌名">
                        <button id="searchButton" type="button">
                            搜尋
                        </button>
                    </div>
                    <div id="customLrcName" class="custom-lrc-name"></div>
                </div>
                <div class="section">
                    <div class="section-title">
                        歌詞選擇
                    </div>
                    <div id="lyricResults" class="lyric-results">
                        <div style="
                            color:#555;
                            font-size:13px;
                        ">
                            尚未搜尋歌曲
                        </div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">
                        歌詞效果
                    </div>
                    <div class="setting">
                        <select id="effectSelect">
                            <option value="classic">
                                經典模式
                            </option>
                            <option value="smoke">
                                煙霧消散
                            </option>
                            <option value="vertical">
                                直排左右交替
                            </option>
                        </select>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">
                        字體
                    </div>
                    <div class="setting font-setting">
                        <select id="fontSelect">
                            <optgroup label="系統字體">
                                <option value="Arial">
                                    Arial
                                </option>
                                <option value="Microsoft JhengHei">
                                    微軟正黑體
                                </option>
                                <option value="sans-serif">
                                    Sans Serif
                                </option>
                                <option value="serif">
                                    Serif
                                </option>
                            </optgroup>
                            <optgroup label="Google 字體（繁中，選取後載入）">
                                <option value="'Noto Sans TC', sans-serif">
                                    思源黑體
                                </option>
                                <option value="'Noto Serif TC', serif">
                                    思源宋體
                                </option>
                                <option value="'Noto Sans HK', sans-serif">
                                    思源黑體（港）
                                </option>
                                <option value="'Noto Serif HK', serif">
                                    思源宋體（港）
                                </option>
                                <option value="'LXGW WenKai TC', cursive">
                                    霞鶩文楷（手寫楷體）
                                </option>
                                <option value="'LXGW WenKai Mono TC', monospace">
                                    霞鶩文楷等寬
                                </option>
                                <option value="'Cactus Classical Serif', serif">
                                    仙人掌古典明體
                                </option>
                                <option value="'Ma Shan Zheng', cursive">
                                    馬善政毛筆行書
                                </option>
                                <option value="'Liu Jian Mao Cao', cursive">
                                    劉建毛草（草書）
                                </option>
                                <option value="'Long Cang', cursive">
                                    龍藏（手寫）
                                </option>
                                <option value="'Zhi Mang Xing', cursive">
                                    志莽行書
                                </option>
                                <option value="'ZCOOL KuaiLe', cursive">
                                    站酷快樂體
                                </option>
                                <option value="'ZCOOL XiaoWei', serif">
                                    站酷小薇（文藝）
                                </option>
                                <option value="'ZCOOL QingKe HuangYou', sans-serif">
                                    站酷慶科黃油體
                                </option>
                            </optgroup>
                        </select>
                        <button id="fontSizeMinus" class="font-size-btn" type="button" title="縮小字體">
                            −
                        </button>
                        <button id="fontSizePlus" class="font-size-btn" type="button" title="放大字體">
                            ＋
                        </button>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">
                        顏色
                    </div>
                    <div class="color-settings">
                        <div class="color-setting">
                            <div class="color-setting-label">
                                歌詞文字
                            </div>
                            <input id="colorInput" class="color-input" type="color" value="#7564a6">
                        </div>
                        <!-- 底色 -->
                        <div class="color-setting">
                            <div class="color-setting-label">
                                歌詞底色
                            </div>
                            <input id="backgroundColorInput" class="color-input" type="color" value="#888888">
                        </div>
                    </div>
                </div>

                <!-- =================================================
                 原本完整模式使用的 YouTube
                 controller 時隱藏
                 ================================================= -->

                <div class="section sidebar-youtube-section">
                    <div class="section-title">
                        YouTube 音源
                    </div>
                    <div class="youtube-control">
                        <input id="youtubeInput" class="youtube-input" type="text" placeholder="YouTube 網址或影片 ID">
                        <div class="youtube-actions">
                            <button id="youtubeLoadButton" type="button">
                                載入
                            </button>
                            <button id="youtubePlayButton" class="play-button" type="button">
                                ▶
                            </button>
                        </div>
                        <div id="youtubeTime" class="youtube-time">
                            00:00 / 00:00
                        </div>
                        <div id="youtubePlayer" class="youtube-player"></div>
                    </div>
                </div>
                <div id="connectionStatus" class="connection-status">
                    BroadcastChannel 等待中
                </div>
            </div>
            <div class="sidebar-resizer" id="sidebarResizer"></div>
        </aside>

        <main class="stage" id="stage">

            <div class="lyrics" id="lyrics">

                <div class="lyrics-track" id="lyricsTrack"></div>

                <div class="empty-lyrics" id="emptyLyrics">
                    搜尋歌曲後選擇歌詞
                </div>

                <div class="lyrics-center-fade"></div>

            </div>

            <div class="controller-audio" id="controllerAudio">
                <div class="controller-audio-header">
                    <div class="controller-audio-title">
                        YouTube 音源
                    </div>
                </div>
                <div class="controller-audio-content">
                    <div class="youtube-control">
                        <input id="controllerYoutubeInput" class="youtube-input" type="text"
                            placeholder="YouTube 網址或影片 ID">
                        <div class="youtube-actions">
                            <button id="controllerYoutubeLoadButton" type="button">
                                載入音源
                            </button>
                            <button id="controllerYoutubePlayButton" class="play-button" type="button">
                                ▶
                            </button>
                        </div>
                        <div id="controllerYoutubeTime" class="youtube-time">
                            00:00 / 00:00
                        </div>
                    </div>
                    <div class="controller-youtube-player" id="controllerYoutubePlayer"></div>
                    <div class="youtube-info">
                        <span class="youtube-info-label">
                            目前音源
                        </span>
                        <span id="youtubeVideoInfo" class="youtube-info-value">
                            尚未載入
                        </span>
                    </div>
                </div>
            </div>
        </main>

        <aside class="timeline" id="timeline">
            <div class="timeline-track"></div>
            <div class="timeline-progress" id="timelineProgress"></div>
            <div class="timeline-thumb" id="timelineThumb"></div>
            <div class="timeline-time" id="timelineTime">
                00:00
            </div>
        </aside>
    </div>

    <footer class="offset-bar">
        <div class="play-control">
            <button id="playButton" class="play-button" type="button">
                ▶
            </button>
            <button id="modeButton" class="mode-button" type="button">
                同步播放
            </button>
            <button id="resetButton" type="button">
                重置
            </button>
        </div>
        <div class="offset-title">
            時間偏移
        </div>
        <div class="offset-slider">
            <input id="offsetSlider" class="offset-range" type="range" min="-20" max="20" step="0.1" value="0">
            <div class="offset-label">
                <span>-20s</span>
                <span>0</span>
                <span>+20s</span>
            </div>
        </div>
        <div id="offsetValue" class="offset-value">
            0.0s
        </div>
    </footer>

    <!-- anime.js v4（UMD，全域物件 window.anime） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/4.4.1/anime.umd.min.js"></script>

    <!-- Kuroshiro：日文歌詞自動轉 romaji / 附歌詞 -->
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro/dist/kuroshiro.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji/dist/kuroshiro-analyzer-kuromoji.min.js"></script>
    <script src="app.js"></script>

</body>

</html>

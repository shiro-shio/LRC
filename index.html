        function syncYouTubeTime() {

            if (
                playbackMode !==
                "sync"
            ) {

                stopYouTubeSync();

                return;
            }

            if (
                !youtubePlayer ||
                !youtubeReady ||
                !youtubeHasVideo
            ) {

                return;
            }

            const currentTime =
                youtubePlayer.getCurrentTime();

            if (
                !Number.isFinite(

                )
            ) {

            }

            player.setTime(
                currentTime
            );

            updateYouTubeTime();
        }


        /* =========================================================
           YouTube 時間
           ========================================================= */

        function updateYouTubeTime() {

            if (
                !youtubePlayer ||
                !youtubeReady
            ) {

                return;
            }

            const current =
                youtubePlayer.getCurrentTime();

            const duration =
                youtubePlayer.getDuration();

            if (
                !Number.isFinite(current) ||
                !Number.isFinite(duration)
            ) {

                return;
            }

            const text =
                `${formatYouTubeTime(current)} / ${formatYouTubeTime(duration)}`;

            const element =
                document.getElementById(
                    "youtubeTime"
                );

            if (element) {

                element.textContent =
                    text;
            }

            if (controllerYoutubeTime) {

                controllerYoutubeTime.textContent =
                    text;
            }
        }


        function formatYouTubeTime(
            seconds
        ) {

            seconds =
                Math.max(
                    0,
                    Math.floor(seconds)
                );

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const secs =
                seconds % 60;

            return (
                `${String(
                    minutes
                ).padStart(2, "0")}:` +
                `${String(
                    secs
                ).padStart(2, "0")}`
            );
        }


        /* =========================================================
           YouTube Video ID
           ========================================================= */

        function getYouTubeVideoId(
            value
        ) {

            const input =
                value.trim();

            if (!input) {
                return null;
            }

            if (
                /^[a-zA-Z0-9_-]{11}$/.test(
                    input
                )
            ) {

                return input;
            }

            try {

                const url =
                    new URL(input);

                const hostname =
                    url.hostname.toLowerCase();

                if (
                    hostname ===
                    "www.youtube.com" ||
                    hostname ===
                    "youtube.com" ||
                    hostname ===
                    "m.youtube.com"
                ) {

                    const id =
                        url.searchParams.get(
                            "v"
                        );

                    if (
                        id &&
                        /^[a-zA-Z0-9_-]{11}$/.test(
                            id
                        )
                    ) {

                        return id;
                    }

                    const embedMatch =
                        url.pathname.match(
                            /^\/embed\/([a-zA-Z0-9_-]{11})/
                        );

                    if (embedMatch) {

                        return embedMatch[1];
                    }

                    const shortsMatch =
                        url.pathname.match(
                            /^\/shorts\/([a-zA-Z0-9_-]{11})/
                        );

                    if (shortsMatch) {

                        return shortsMatch[1];
                    }
                }

                if (
                    hostname ===
                    "youtu.be"
                ) {

                    const id =
                        url.pathname
                            .slice(1)
                            .split("/")[0];

                    if (
                        /^[a-zA-Z0-9_-]{11}$/.test(
                            id
                        )
                    ) {

                        return id;
                    }
                }

            } catch {
            }

            return null;
        }

                                    false
                                );
                            }

                            break;


                        /* -----------------------------------------
                           字體
                           ----------------------------------------- */

                        case "font":

                            if (
                                pageMode ===
                                "subtitle"
                            ) {

                                const lyrics =
                                    document.getElementById(
                                        "lyrics"
                                    );

                                lyrics.style.fontFamily =
                                    message.font;
                            }

                            break;


                        /* -----------------------------------------
                           文字顏色
                           ----------------------------------------- */

                        case "color":

                            if (
                                pageMode ===
                                "subtitle"
                            ) {

                                if (colorInput) {

                                    colorInput.value =
                                        message.color;
                                }

                                player.update();
                            }

                            break;


                        /* -----------------------------------------
                           底色
                           ----------------------------------------- */

                        case "background-color":

                            if (
                                pageMode ===
                                "subtitle"
                            ) {

                                stage.style.setProperty(
                                    "--lyrics-background",
                                    message.color
                                );

                                if (
                                    backgroundColorInput
                                ) {

                                    backgroundColorInput.value =
                                        message.color;
                                }

                                player.update();
                            }

                            break;


                        /* -----------------------------------------
                           播放模式
                           ----------------------------------------- */

                        case "playback-mode":

                            if (
                                pageMode ===
                                "subtitle"
                            ) {

                                playbackMode =
                                    message.mode;

                                updatePlaybackModeUI();
                            }

                            break;


                        /* -----------------------------------------
                           YouTube
                           ----------------------------------------- */

                        case "youtube-load":

                            /*
                             * 字幕輸出端不載入 YouTube。
                             */
                            break;


                        /* -----------------------------------------
                           重置
                           ----------------------------------------- */

                        case "reset":

                            if (
                                pageMode ===
                                "subtitle"
                            ) {

                                player.pause(
                                    false
                                );

                                player.setTime(
                                    0,
                                    false
                                );
                            }

                            break;


                        /* -----------------------------------------
                           控制器要求目前狀態
                           ----------------------------------------- */

                        case "request-state":

                            if (
                                pageMode !==
                                "subtitle"
                            ) {

                                broadcast(
                                    "state",
                                    {
                                        lrcText:
                                            buildCurrentLRC(),

                                        time:
                                            player.currentTime,

                                        offset:
                                            player.offset,

                                        theme:
                                            lyricsTheme,

                                        color:
                                            colorInput
                                                ? colorInput.value
                                                : "#7564a6",

                                        backgroundColor:
                                            backgroundColorInput
                                                ? backgroundColorInput.value
                                                : "#111111",

                                        font:
                                            fontSelect
                                                ? fontSelect.value
                                                : "Arial",

                                        mode:
                                            playbackMode,

                                        playing:
                                            player.playing
                                    }
                                );
                            }

                            break;


                        /* -----------------------------------------
                           回傳目前狀態
                           ----------------------------------------- */

                        case "state":

                            if (
                                pageMode ===
                                "subtitle"
                            ) {

                                applyRemoteState(
                                    message
                                );
                            }

                            break;
                    }
                };

            setBroadcastStatus(
                false
            );
        }


        /* =========================================================
           建立目前 LRC
           ========================================================= */

        function buildCurrentLRC() {

            if (!player.lyrics.length) {
                return "";
            }

            return player.lyrics
                .map(
                    line =>
                        `[${formatLRCTime(line.time)}]${line.text}`
                )
                .join("\n");
        }


        function formatLRCTime(
            seconds
        ) {

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const remaining =
                seconds -
                minutes * 60;

            return (
                `${String(
                    minutes
                ).padStart(2, "0")}:` +
                `${remaining
                    .toFixed(3)
                    .padStart(6, "0")}`
            );
        }


        /* =========================================================
           套用遠端狀態
           ========================================================= */

        function applyRemoteState(
            state
        ) {

            if (
                state.lrcText
            ) {

                player.load(
                    state.lrcText,
                    false
                );
            }

            if (
                Number.isFinite(
                    Number(
                        state.offset
                    )
                )
            ) {

                player.setOffset(
                    Number(
                        state.offset
                    ),
                    false
                );
            }

            if (
                state.theme ===
                "black" ||
                state.theme ===
                "white"
            ) {

                lyricsTheme =
                    state.theme;

                updateLyricsTheme(
                    false
                );
            }

            if (
                state.color &&
                colorInput
            ) {

                colorInput.value =
                    state.color;

                player.update();
            }

            if (
                state.backgroundColor
            ) {

                stage.style.setProperty(
                    "--lyrics-background",
                    state.backgroundColor
                );

                if (
                    backgroundColorInput
                ) {

                    backgroundColorInput.value =
                        state.backgroundColor;
                }

                player.update();
            }

            if (
                state.font
            ) {

                document.getElementById(
                    "lyrics"
                ).style.fontFamily =
                    state.font;

                if (fontSelect) {

                    fontSelect.value =
                        state.font;
                }
            }

            if (
                state.mode
            ) {

                playbackMode =
                    state.mode;

                updatePlaybackModeUI();
            }

            if (
                Number.isFinite(
                    Number(
                        state.time
                    )
                )
            ) {

                player.setTime(
                    Number(
                        state.time
                    ),
                    false
                );
            }

            if (state.playing) {

                player.play(
                    false
                );

            } else {

                player.pause(
                    false
                );
            }
        }


        /* =========================================================
           字幕模式啟動
           ========================================================= */

        if (
            pageMode ===
            "subtitle"
        ) {

            setTimeout(
                () => {

                    broadcast(
                        "request-state"
                    );

                },
                200
            );
        }


        /* =========================================================
           初始化
           ========================================================= */

        updateLyricsTheme(
            false
        );

        updatePlaybackModeUI();

    </script>

</body>

</html>
